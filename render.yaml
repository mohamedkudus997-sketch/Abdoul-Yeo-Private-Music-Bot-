services:
  - type: web
    name: musicbot-v2
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: musicbot-db
          property: connectionString
      - key: MAX_FILE_MB
        value: "49"
      - key: MAX_DURATION
        value: "900"
      - key: MAX_ALBUM_TRACKS
        value: "10"
      - key: COOLDOWN_SECONDS
        value: "5"
      - key: WORKERS
        value: "3"
      - key: ITUNES_COUNTRY
        value: "FR"

databases:
  - name: musicbot-db
    plan: free
